<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de estoque</title>
</head>
<body>
  <h1>Controle de estoque</h1>
  <p th:if="${mensagem}" th:text="${mensagem}"></p>
  <p th:if="${erro}" th:text="${erro}"></p>

  <form method="post" action="/produtos">
    <label>Produto <input name="nome" required></label>
    <button type="submit">Cadastrar</button>
  </form>

  <table>
    <thead><tr><th>Produto</th><th>Estoque</th><th>Status</th><th>Movimentação</th></tr></thead>
    <tbody>
      <tr th:each="produto : ${produtos}">
        <td th:text="${produto.nome}"></td>
        <td th:text="${produto.estoque}"></td>
        <td th:text="${produto.status}"></td>
        <td>
          <form th:action="@{/produtos/{id}/entrada(id=${produto.id})}" method="post">
            <input type="number" name="quantidade" min="1" required>
            <button type="submit">Entrada</button>
          </form>
          <form th:action="@{/produtos/{id}/saida(id=${produto.id})}" method="post">
            <input type="number" name="quantidade" min="1" required>
            <button type="submit">Saída</button>
          </form>
          <form th:action="@{/produtos/{id}/descontinuar(id=${produto.id})}" method="post">
            <button type="submit">Descontinuar (ADM)</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
