<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos de venda</title>
</head>
<body>
  <h1>Pedidos de venda</h1>
  <p th:if="${mensagem}" th:text="${mensagem}"></p>

  <form method="post" action="/pedidos">
    <label>Cliente <input name="cliente" required></label>
    <label>E-mail <input type="email" name="email" required></label>
    <label>Valor <input type="number" name="valor" min="0.01" step="0.01" required></label>
    <button type="submit">Fechar pedido</button>
  </form>

  <table>
    <thead><tr><th>Pedido</th><th>Cliente</th><th>Valor</th><th>Status</th><th>Fatura</th><th>Ação</th></tr></thead>
    <tbody>
      <tr th:each="pedido : ${pedidos}">
        <td th:text="${pedido.id}"></td>
        <td th:text="${pedido.cliente}"></td>
        <td th:text="${pedido.valor}"></td>
        <td th:text="${pedido.status}"></td>
        <td th:text="${pedido.faturaId}"></td>
        <td>
          <form th:if="${pedido.faturaId == null}" th:action="@{/pedidos/{id}/faturar(id=${pedido.id})}" method="post">
            <button type="submit">Tentar faturar novamente</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
